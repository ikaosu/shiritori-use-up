<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; font-family: "Shippori Mincho", "Yu Mincho", serif; color: #f6ecd2;
  background: radial-gradient(900px 500px at 20% 0%, #3a5688, transparent 65%), #1f2f4d; position: relative; }
.frame { position: absolute; inset: 22px; border: 3px solid #c79a3a; border-radius: 28px; opacity: .85; }
.wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
.kick { font-size: 26px; letter-spacing: .4em; color: #d9c28c; }
.row { display: flex; gap: 14px; }
.t { width: 136px; height: 158px; display: grid; place-items: center; font-size: 84px; font-weight: 800; color: #1b2a44; border-radius: 16px;
  background: linear-gradient(#fffef8, #f2e8cf); border-bottom: 12px solid #3aa07f; box-shadow: 0 8px 0 #0c1424, 0 22px 30px rgba(0,0,0,.5); }
.t.red { background: linear-gradient(#ee6549, #c8402a); color: #fff; border-bottom-color: #8e2b1a; transform: rotate(-4deg); }
.tag { font-size: 46px; font-weight: 800; letter-spacing: .12em; }
.tag em { font-style: normal; color: #ff8f78; }
.mini { display: flex; gap: 8px; margin-top: 4px; }
.m { width: 46px; height: 54px; border-radius: 8px; background: repeating-linear-gradient(135deg, #1b5242 0 4px, #215f4e 4px 8px); border-bottom: 4px solid #0f3125; opacity: .9; }
.m.up { background: linear-gradient(#fffef8, #f2e8cf); border-bottom: 6px solid #3aa07f; }
</style></head><body>
<div class="frame"></div>
<div class="wrap">
  <div class="kick">毎日ひとつのお題</div>
  <div class="row"><div class="t red">節</div><div class="t">約</div><div class="t">し</div><div class="t">り</div><div class="t">と</div><div class="t">り</div></div>
  <div class="tag">使った文字は、<em>二度と使えない。</em></div>
</div>
</body></html>
